[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rise-sharing"
version = "0.1.0"
description = "Revision 9 research ride-sharing platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7", "httpx>=0.28,<1", "argon2-cffi>=23,<26", "PyJWT>=2.10,<3",
  "shapely>=2,<3", "redis>=5,<9", "web3>=7,<9", "eth-account>=0.13,<1",
  "numpy>=2,<3", "pandas>=2,<4", "scipy>=1.14,<2", "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5", "pyarrow>=19,<27", "ortools>=9.12,<10"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1"]
research = []

[tool.setuptools.packages.find]
include = ["app*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["postgres: requires TEST_POSTGRES_URL", "integration: external infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

