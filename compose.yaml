services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rise
      POSTGRES_USER: rise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rise -d rise"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "200", "/data/vietnam.osrm"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["./data/osrm/car:/data:ro"]
  osrm-motorbike:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "200", "/data/vietnam.osrm"]
    ports: ["127.0.0.1:5001:5000"]
    volumes: ["./data/osrm/motorbike:/data:ro"]
  migrate:
    build: .
    profiles: ["application"]
    env_file: .env
    environment:
      RISE_DATABASE_URL: postgresql+psycopg://rise:${POSTGRES_PASSWORD}@postgres:5432/rise
      RISE_AUTO_CREATE_SCHEMA: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    profiles: ["application"]
    env_file: .env
    environment: &app_environment
      RISE_DATABASE_URL: postgresql+psycopg://rise:${POSTGRES_PASSWORD}@postgres:5432/rise
      RISE_REDIS_URL: redis://redis:6379/0
      RISE_AUTO_CREATE_SCHEMA: "false"
      RISE_RUN_WORKER: "false"
      RISE_OSRM_CAR_URL: http://osrm-car:5000
      RISE_OSRM_MOTORBIKE_URL: http://osrm-motorbike:5000
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["app_data:/srv/rise/data", "./artifacts/models:/srv/rise/artifacts/models:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: .
    profiles: ["application"]
    env_file: .env
    environment: *app_environment
    command: ["python", "-m", "app.jobs"]
    volumes: ["app_data:/srv/rise/data", "./artifacts/models:/srv/rise/artifacts/models:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build: ./web
    profiles: ["application"]
    environment:
      API_BASE_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  app_data:
